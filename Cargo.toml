[package]
name = "PureWaterSpiritBot"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = { version = "1" }
async-trait = { version = "0.1" }
base64 = { version = "0.23" }
clap = { version = "4.6", features = ["derive"] }
sea-orm = { version = "2.0", features = ["sqlx-sqlite", "sqlx-mysql", "sqlx-postgres", "runtime-tokio-rustls", "sqlite-use-returning-for-3_35"] }
sea-orm-migration = { version = "2.0", features = ["sqlx-sqlite", "sqlx-mysql", "sqlx-postgres", "runtime-tokio-rustls"] }
futures = { version = "0.3" }
jiff = { version = "0.2", features = ["serde"] }
teloxide = { version = "0.17", features = ["macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "net", "process"] }
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
secrecy = { version = "0.10", features = ["serde"] }
tempfile = { version = "3" }
thiserror = { version = "2" }
toml = { version = "1.1" }
reqwest = { version = "0.13", features = ["json"] }
url = { version = "2" }

[dev-dependencies]
chrono = { version = "0.4" }
tokio = { version = "1", features = ["test-util"] }
wiremock = { version = "0.6" }
